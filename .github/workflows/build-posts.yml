name: Build Post Lists

# Runs on every push to main: rebuilds the homepage and section lists from
# posts.json, then (when the WM_PASS secret is set) refreshes the encrypted
# webmaster index so new, moved or removed pages show up there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-posts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WM_PASS: ${{ secrets.WM_PASS }}
      WM_PASS_OLD: ${{ secrets.WM_PASS_OLD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run build script
        run: node scripts/build-post-lists.js

      # The plaintext lands in the git-ignored webmaster-src/ and is never
      # committed; only webmaster.html (ciphertext) is, and only if it changed.
      # To change the password: set WM_PASS to the new one and, once, add
      # WM_PASS_OLD holding the current one; the page is re-locked with
      # WM_PASS on the next run. Then delete WM_PASS_OLD.
      - name: Refresh webmaster index
        if: env.WM_PASS != ''
        run: |
          if ! node scripts/webmaster-vault.js decrypt; then
            if [ -z "$WM_PASS_OLD" ]; then
              echo "::error::WM_PASS does not open webmaster.html. Set WM_PASS to the current webmaster password, or add WM_PASS_OLD (the current password) once to switch the page to WM_PASS."
              exit 1
            fi
            echo "Switching the webmaster password to WM_PASS"
            WM_PASS="$WM_PASS_OLD" node scripts/webmaster-vault.js decrypt
          fi
          node scripts/webmaster-vault.js encrypt

      - name: Commit updated pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html continuum.html workshop.html locker.html flightdeck.html webmaster.html
          git diff --staged --quiet || git commit -m "chore: rebuild post lists and webmaster index [skip ci]"
          git push
